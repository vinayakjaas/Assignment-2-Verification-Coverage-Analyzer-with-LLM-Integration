[project]
name = "coverage-analyzer"
version = "0.1.0"
description = "Functional coverage analyzer with LLM suggestions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typer==0.12.3",
  "pydantic==2.7.1",
  "rich==13.7.1",
  "openai==1.23.6",
  "anthropic==0.25.4",
  "httpx==0.27.0",
  "streamlit==1.33.0",
  "python-dotenv==1.0.1",
]

[project.scripts]
coverage-analyzer = "coverage_analyzer.cli:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

